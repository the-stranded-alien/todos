<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="description" content="A private, offline-first to-do list. Everything stays in your browser." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todos</title>
    <meta name="theme-color" content="#ebecf6" />
    <script>
      // Apply the saved theme before first paint (keep in sync with src/themes.js)
      ;(function () {
        var DARK = ['dark', 'ocean', 'nord', 'monokai', 'neon', 'neon-blue', 'neon-green', 'neon-purple', 'neon-rainbow']
        var EXTRA = ['ocean', 'forest', 'sun', 'nord', 'monokai', 'solarized', 'neon', 'neon-blue', 'neon-green', 'neon-purple', 'neon-rainbow']
        var p = {}
        try {
          var raw = localStorage.getItem('todos-prefs')
          if (raw) p = JSON.parse(raw) || {}
          else { var legacy = localStorage.getItem('theme'); if (legacy) p.theme = legacy }
        } catch (e) {}
        var t = p.theme
        if (!t) { try { t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' } catch (e) { t = 'light' } }
        if (EXTRA.indexOf(t) >= 0 && !p.extraThemes) t = DARK.indexOf(t) >= 0 ? 'dark' : 'light'
        var c = document.documentElement.classList
        if (DARK.indexOf(t) >= 0) c.add('dark')
        if (t.indexOf('neon') === 0) { c.add('theme-neon'); if (t !== 'neon') c.add('theme-' + t) }
        else if (t !== 'light' && t !== 'dark') c.add('theme-' + t)
        if (p.highContrast) c.add('high-contrast')
        document.documentElement.setAttribute('data-density', p.density || 'comfortable')
        if (p.reduceMotion) document.documentElement.setAttribute('data-motion', 'reduce')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
